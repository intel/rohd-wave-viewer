name: App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build App
    permissions:
      contents: read
      pages: write
    timeout-minutes: 90
    runs-on: ${{ github.repository_owner == 'intel' && 'intel-ubuntu-latest' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Verify Flutter and Dart on PATH
        run: bash scripts/verify_flutter_version.sh

      - name: Install native build tools
        run: tool/gh_actions/install_build_tools.sh

      - name: Install Rust toolchain
        run: tool/gh_actions/install_rust_1_92.sh

      - name: Install WASM tools
        run: tool/gh_actions/install_wasm_tools.sh

      - name: Install project dependencies
        run: tool/gh_actions/install_dependencies.sh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build standalone application
        run: tool/gh_actions/build_app.sh

      - name: Generate API documentation
        run: DARTDOC_OUTPUT=build/web/api tool/gh_actions/generate_documentation.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy App
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
